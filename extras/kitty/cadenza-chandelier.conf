# Cadenza Chandelier — kitty
# Gerado por src/generators/kitty.ts a partir de palette/. NÃO editar à mão.
# Variante sem vermelho na sintaxe: fundo mais escuro (o vestido preto) e bronze como acento.

foreground              #e8eced
background              #080a0b
# "none" mantém a cor da saída por cima da seleção, como no editor.
selection_foreground    none
selection_background    #0c2b34

cursor                  #d49e6f
cursor_text_color       #080a0b
url_color               #80a7f0

# Bordas de split: a janela ativa leva o accent, as outras somem no fundo.
active_border_color     #d49e6f
inactive_border_color   #272b2d
bell_border_color       #fab048
visual_bell_color       none

# Barra de abas plana: ativa um degrau acima, inativas no fundo.
tab_bar_background      #080a0b
tab_bar_margin_color    #080a0b
active_tab_foreground   #e8eced
active_tab_background   #171a1b
active_tab_font_style   bold
inactive_tab_foreground #81878a
inactive_tab_background #080a0b
inactive_tab_font_style normal

# Marcas (kitten marks / hints)
