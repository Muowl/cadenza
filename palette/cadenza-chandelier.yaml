# ============================================================
# VARIANT "Cadenza Chandelier" — Astra's black-and-white outfit
# (the Chandelier skin). The jacket's red goes; the bronze of the
# ribbons takes over as the accent.
#
# This is an OVERLAY: only what changes. Everything else (text, the
# other accents, anchors, roles not listed) comes from cadenza.yaml —
# see loadPaletteVariant in src/lib/palette.ts. All three gates run on
# this variant just like on the base.
#
# Who it's for: people who want Cadenza without red in the syntax. Here
# red is left for ONE thing only — errors — and weighs more for it.
# ============================================================

meta:
  name: "Cadenza Chandelier"
  slug: "cadenza-chandelier"
  variant: "dark"
  author: "muowl"
  description: "Variant without red in the syntax: a darker background (the black dress) and bronze as the accent."

palette:
  # Backgrounds one step darker (L .145 in the editor, close to #0a0a0a).
  # The selection doesn't change: comments still sit at 4.09:1 on it.
  bg0: "#080a0b"        # L .145
  bg1: "#0e1112"        # L .175
  bg2: "#171a1b"        # L .215
  bg3: "#272b2d"        # L .285

  # Ribbon bronze (anchor #a78464, h 64), lightened for legibility:
  # L .74 C .09 h 62 — 8.43:1 on the background. Same L as fg1, separated
  # from it by chroma: ΔE 8.4 in the worst colour-blindness case.
  bronze: "#d49e6f"

  # Errors take the jacket's own red: the variant's only red.
  # The base's coral sat at ΔE 4.1 from bronze under deuteranopia.
  error: "#f05252"

roles:
  syntax:
    keyword: bronze
    tag: bronze
  ui:
    accent: bronze
    cursor: bronze
    border-active: bronze
