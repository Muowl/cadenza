# ============================================================
# SOURCE OF TRUTH for the Cadenza theme.
# Every generator (VS Code, Base24, kitty, Hyprland, Waybar…)
# reads ONLY this file (and the variant overlays next to it).
# No generator may contain a hardcoded hex.
#
# Direction: flat, restrained structure; Astra Yao's colours.
#   - Near-black background, UI in three greys (primary, secondary,
#     subdued text).
#   - Colour is reserved for syntax and a handful of UI signals.
#   - The jacket's red is the signature. Its hue sits at h 24 in OKLCH.
#
# Values are designed in OKLCH (L = lightness, C = chroma, h = hue).
# Comments record each token's L·C·h for future adjustments.
# ============================================================

meta:
  name: "Cadenza"
  slug: "cadenza"
  variant: "dark"
  author: "muowl"
  description: "Near-black dark theme in the colours of Astra Yao (Zenless Zone Zero)."

# ------------------------------------------------------------
# ANCHORS: raw character colours, sampled from the official artwork
# (references/, outside git). NOT consumed by the generators.
# Per-region medians; L·C·h in OKLCH.
# ------------------------------------------------------------
anchors:
  jacket: "#b3232c"       # red jacket, mid light             L .50 C .18 h 24
  jacket-shadow: "#711b21" # jacket in shadow                 L .37 C .12 h 22
  hair-ink: "#101e23"     # hair, petrol-blue near-black      L .23 C .02 h 222
  hair-light: "#92bbb9"   # hair highlight on the poster      L .76 C .04 h 193
  earring: "#8ecdc3"      # jade earrings                     L .80 C .07 h 184
  mic-gold: "#bfa15d"     # microphone gold                   L .72 C .09 h 86
  mic-gold-light: "#f4df90" # gold highlight                  L .90 C .10 h 95
  dress-shade: "#9099b2"  # lavender shadow on the white dress L .68 C .04 h 270
  pearl: "#f3f5f8"        # necklace pearls                   L .97 C .01 h 258
  medallion: "#b65d94"    # magenta medallion centre          L .60 C .13 h 344
  medallion-ring: "#bac785" # lime-green medallion ring       L .80 C .09 h 118
  disc: "#a576c3"         # violet CD clipped to the mic      L .64 C .12 h 311
  disc-rim: "#3b56c6"     # blue CD rim                       L .50 C .18 h 269

# ------------------------------------------------------------
# PALETTE: named tokens the generators can see.
# ------------------------------------------------------------
palette:
  # Backgrounds — near-black with a whisper of the hair's hue (h 222, C ≤ .007).
  # Reads as neutral; the chroma only keeps a "dead" grey from drifting green.
  # Flat structure: editor and chrome share the SAME background, separated
  # by hairline borders (bg3), not by grey panels.
  bg0: "#0d0f10"        # L .167 — editor, sidebar, tabs, status bar, panel
  bg1: "#131517"        # L .194 — floating widgets (autocomplete, hover, menus)
  bg2: "#1b1f20"        # L .236 — hover, active list item, inputs
  bg3: "#2a2f30"        # L .301 — borders, separators, indent guides
  selection: "#0c2b34"  # L .271 C .040 h 220 — the hair's petrol-blue selection.
                        # Comments keep 4.09:1 on top; syntax preserved.

  # LIGHTNESS LADDER — the order of L is what separates colours for people
  # with red-green colour blindness (the a* axis collapses; L and b* remain).
  # Measured by check_cvd: the tightest syntax pair sits at ΔE 7.9.
  # When changing a token, preserve its hue and check the L step.

  # Text — three greys, with more distance between secondary and subdued so
  # comments don't turn into punctuation.
  fg0: "#e8eced"        # L .940 — primary text, variables, properties
  fg1: "#a7acad"        # L .741 — secondary text, operators, punctuation
  muted: "#81878a"      # L .619 — comments, line numbers. Raised from
                        # L .56 to .62: under protanopia scarlet darkens
                        # to L ~.56 and merged with comments (ΔE 5.7).

  # Identity colours — five hues, all from the artwork
  scarlet: "#f05252"    # L .655 C .194 h 24 — jacket. The signature:
                        # control flow, tags, cursor, active tab. Use sparingly.
  orchid: "#c775c9"     # L .681 C .149 h 326 — medallion/CD. Numbers,
                        # constants, decorators. Moved from pink (h 352) to
                        # orchid: under deuteranopia the pink became the
                        # punctuation grey (ΔE 2.0).
  lilac: "#a5b5eb"      # L .780 C .079 h 272 — the dress's lavender shadow.
                        # Types, classes, components, namespaces.
  jade: "#8bdacf"       # L .834 C .080 h 184 — earrings and hair highlight.
                        # Functions and attributes (attributes are italic).
  gold: "#eecf84"       # L .864 C .100 h 88 — microphone. Strings.

  # States (diagnostics, git, diffs). They collide with some syntax tokens
  # under colour blindness, and that is accepted: they always come with a
  # tinted background, underline or gutter marker as reinforcement.
  error: "#f76e52"      # L .700 C .174 h 33 — a more coral red than
                        # scarlet, so errors aren't mistaken for keywords
  warning: "#fab048"    # L .810 C .145 h 72 — amber, more orange than gold
  info: "#80a7f0"       # L .729 C .115 h 262 — the CD rim's blue
  success: "#a4ce6c"    # L .799 C .135 h 128 — the medallion's lime-green ring

# ------------------------------------------------------------
# ROLES: semantic mapping. Values reference palette names.
# THIS is where "keyword is scarlet" is decided, not in the generator.
# ------------------------------------------------------------
roles:
  syntax:
    # Red only for CONTROL FLOW: if, else, for, while, match, switch,
    # return, break, continue, throw, try/catch, await, yield.
    # Every other reserved word — declarations (const, fn, def, class,
    # interface, =>), modifiers (pub, public, static, async) and modules
    # (import, export, use, using, package, #include) — stays in the
    # punctuation grey: the declared name is what you need to read.
    #
    # The boundary is the one language servers use: rust-analyzer marks
    # `keyword.controlFlow` and Roslyn (C#) separates `controlKeyword` from
    # `keyword`. With the server running, only that split survives — so
    # imports are grey too, in every language, instead of red in some and
    # grey in others.
    keyword: scarlet
    storage: fg1
    string: gold
    function: jade
    number: orchid
    constant: orchid      # true, null, CONSTANTS
    type: lilac           # classes, interfaces, JSX components
    variable: fg0
    property: fg0
    parameter: fg0        # italics set it apart from variables
    comment: muted
    operator: fg1
    punctuation: fg1
    tag: scarlet          # HTML/JSX tags: same family as keywords
    attribute: jade       # HTML/JSX attributes, italic. Jade rather than lilac:
                          # <Button onClick=…> puts type and attribute side by side
    regexp: orchid
    escape: orchid        # \n, \t inside gold strings
    builtin: fg1          # this, self, cls, super — italic. Shows up on almost
                          # every line of Python and Rust: red there drowned
                          # out the control-flow signal.
    namespace: lilac
    decorator: orchid
    interpolation: orchid # the ${ } marks inside template strings
    inserted: success
    deleted: error
    changed: warning
    quote: muted
    doctag: fg1           # @param, <summary>, JSDoc names: one step above
                          # the comment, italic

  ui:
    accent: scarlet       # cursor, active tab, badges, focus, progress
    cursor: scarlet
    link: info
    # Matched characters in quick open / autocomplete. Jade clears every
    # list background comfortably and keeps red scarce.
    list-highlight: jade
    terminal-bg: bg0
    # Desktop (Hyprland, Waybar): active window border and alerts.
    border-active: scarlet
    border-inactive: bg3
    urgent: error

  # The 16 ANSI slots. Only the 8 bases are decided here: the generator
  # derives each "bright" by raising L by +0.10 in OKLCH with the same hue
  # and chroma (see ANSI_BRIGHT_L).
  terminal:
    black: bg3
    red: scarlet
    green: success
    yellow: gold
    blue: info
    magenta: orchid
    cyan: jade
    white: fg1

  # bright-black is not a panel colour: it's the grey CLIs use for dimmed
  # text (git hints, fish/zsh suggestions). Points at muted.
  terminal-bright:
    black: muted
